apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: ns-franck-barry
  labels:
    app: backend-api
    owner: franck.barry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend-api
        image: ghcr.io/jaims-31/bilan-ecf-back:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: APP_CORS_ALLOWED_ORIGINS
          value: "http://aks-nonprod-prf2026.francecentral.cloudapp.azure.com"
