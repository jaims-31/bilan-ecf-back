name: Backend CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  AKS_CLUSTER_NAME: aks-nonprod-prf2026
  AKS_RG: rg-shared-prf2026
  OWNER_TAG: franck.barry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Tests et Build Maven
        run: ./mvnw clean package -DskipTests

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Set up kubelogin
        uses: Azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.4'     

      - name: Configurer kubectl (AKS)
        run: az aks get-credentials --resource-group ${{ env.AKS_RG }} --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Déploiement Kubernetes avec récupération par Tags
        run: |
          KV_NAME=$(az resource list --tag owner=${{ env.OWNER_TAG }} --tag component=key-vault --query "[0].name" -o tsv)
          REDIS_NAME=$(az resource list --tag owner=${{ env.OWNER_TAG }} --tag component=cache-redis --query "[0].name" -o tsv)
          
          echo "Key Vault trouvé : $KV_NAME"
          echo "Redis trouvé : $REDIS_NAME"
          
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          
          kubectl rollout restart deployment/backend-api -n franck-barry